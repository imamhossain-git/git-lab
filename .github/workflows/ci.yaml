name: CI

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch: # manual button in Actions tab
env:
  NODE_ENV: development # you define

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node}}
      - run: npm ci
      - run: npm test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual button in Actions tab

env: #global
    NODE_ENV: development
jobs:
  # Job 1: Run Tests
  test:
    runs-on: ubuntu-latest
    env: #job-level
      GREETING: Hello
    steps:
      - run: echo "Hi ${{github.actor }} on ${{github.ref}}"
      - run: echo $GREETING #env variable from job-level
      - run: echo ${{ runner.os}} #env variable from secrets
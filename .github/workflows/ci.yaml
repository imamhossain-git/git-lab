name: CI

on:
  push:
    branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch: # manual button in Actions tab

env: #global
  NODE_ENV: production
jobs:
  # Job 1: Run Tests
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
